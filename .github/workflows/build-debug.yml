name: Build Debug APK

on:
  push:
    branches:
      - feature/gamification
      - develop
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para obtener git hash

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName | tail -1)
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "GIT_HASH=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "📱 Building version: $VERSION_NAME"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MisLecturitas-${{ steps.version.outputs.VERSION_NAME }}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MisLecturitas-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/MisLecturitas-*.apk
          retention-days: 90

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 30
